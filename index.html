<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so env(safe-area-inset-*) resolves to real numbers on a
     notched phone; the app rail and the mobile tab bar already pad with it.
     No maximum-scale and no user-scalable=no: pinch zoom stays available, and
     the reason iOS used to zoom on focus was a sub-16px field, not the meta. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- One per scheme, both taken from the palette rather than invented: paper is
     the ground every route sits on, ink is the dark band. -->
<meta name="theme-color" content="#f7faf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d2b1e" media="(prefers-color-scheme: dark)">
<title>MindMap, a teen wellness app</title>
<meta name="description" content="MindMap turns everyday stress signals into one score and one plain sentence, from a patch on the forearm or from the phone already in your pocket.">
<!-- Self-hosted, latin and latin-ext only. A webfont stylesheet on another
     host costs a round trip before a single glyph can be measured, and the
     audit timed out on it every run. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/6xKtdSZaM9iE8KbpRA_hK1QNYuDyPw.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/va9I4kzIxd1KFrBoQeNVkqDO.woff2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 28'%3E%3Crect x='2' y='4' width='36' height='20' rx='10' fill='none' stroke='%230d2b1e' stroke-width='2.6'/%3E%3Cpath d='M10.5 18.2 15 10.2 20 15.8 25.4 11 29.5 17.6' fill='none' stroke='%230d2b1e' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='29.5' cy='17.6' r='2.4' fill='%23157446'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<!-- One canonical URL, because there is one document: every route in this site
     is a hash fragment, which a crawler never sends to the server. -->
<link rel="canonical" href="https://mindmappaitent.vercel.app/">
<meta name="author" content="Mikhail">
<meta name="robots" content="index, follow">
<link rel="manifest" href="/manifest.webmanifest">
<!-- The SVG favicon above stays: it is sharp at any tab size and costs no
     request. These are the raster sizes a home screen asks for instead. Every
     one of them, and the card below, is produced by tools/brand/og.py from the
     same 40 x 28 mark and the same palette tokens. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<!-- Open Graph. A pasted link rendered bare before this: no title card, no
     image, nothing to tell a reader what they were being sent. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://mindmappaitent.vercel.app/">
<meta property="og:site_name" content="MindMap">
<meta property="og:title" content="MindMap, a teen wellness app">
<meta property="og:description" content="Map your Mind. Support your Stress. Network your Journey.">
<meta property="og:image" content="https://mindmappaitent.vercel.app/og.png?v=5">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The MindMap logo above three lines: Map your Mind. Support your Stress. Network your Journey. A blue line chart runs along the bottom.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MindMap, a teen wellness app">
<meta name="twitter:description" content="Map your Mind. Support your Stress. Network your Journey.">
<meta name="twitter:image" content="https://mindmappaitent.vercel.app/og.png?v=5">
</head>
<body>
<div id="root"><div style="min-height:60dvh;display:grid;place-content:center;gap:14px;text-align:center;font-family:Quicksand,system-ui,sans-serif">
<div style="display:flex;align-items:center;gap:9px;font-size:23px;font-weight:500;letter-spacing:-.02em;color:#0d2b1e"><svg viewBox="0 0 40 28" style="height:1.15em;width:auto" aria-hidden="true"><rect x="2" y="4" width="36" height="20" rx="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10.5 18.2 15 10.2 20 15.8 25.4 11 29.5 17.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29.5" cy="17.6" r="2.4" fill="#157446"/></svg><span>Mind<span style="color:#157446">Map</span></span></div>
<div style="font-family:Chivo,system-ui,sans-serif;font-size:15px;font-weight:500;color:#426a58">Loading</div>
</div></div>
<script type="module" src="/src/entry.jsx"></script>
</body>
</html>
